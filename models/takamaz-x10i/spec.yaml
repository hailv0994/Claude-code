  - https://www.takamaz.co.jp/product/2199/   # XT-6 (current successor, maker page): footprint 1360x1370, spindle bore 75, X120/Z280, 8-station turret, 7.5/5.5 kW, 4500 rpm, rapid 18/24. Corroborates X-10i footprint. Also source of ref/ photos.

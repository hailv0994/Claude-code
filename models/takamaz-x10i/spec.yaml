confirmed:
  - overall W x D 1360 x 1370 (XT-6 maker page) and 1369 x 1359 (X-10i listing) agree
  - H 1720 and mass 2200 kg: X-10i listing only
  - 6 in chuck, max 3500 rpm (X-10i listing); XT-6 4500 rpm
  - layout (door left, control column right, signal tower top right, coolant tank bottom right, louvre left): from XT-6 photo ref/xt6_front.png
unknown:
  - spindle centre height: ≈1000, XD-10i is 965 and XT-6 lowered it; no X-10i figure
  - X/Z travels: ≈X120 / Z≈250, from XT-6 (X120/Z280); X-10i listing says length 190 so Z probably ~250
  - motor kW: ≈5.5 (XT-6 7.5/5.5)
  - stations: 8 (XT-6 standard 8-sided turret); X-10i not confirmed
  - X-10i-specific exterior (door size, window, panel, logo, column) is taken from XT-6 photo proportions; real X-10i (2003) has an older style with a tilted operator panel
  - every part dims/pos: estimated by scaling the XT-6 front photo to 1360 x 1720; no drawing found
  - signal tower: 1720 H probably includes it, so the column is ≈1570 tall in reality
  - bar feeder interface: none known (XT-6 uses loaders; not a bar machine)
